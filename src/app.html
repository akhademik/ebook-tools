<!doctype html>
<html lang="vi" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!-- Google Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- 100% Offline PDF.js library with CDN fallback -->
		<script src="/vendor/pdfjs/pdf.min.js"></script>
		<script>
			if (typeof window !== 'undefined' && !window.pdfjsLib) {
				var s = document.createElement('script');
				s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
				document.head.appendChild(s);
			}
		</script>

		%sveltekit.head%
	</head>
	<body
		class="m-0 bg-brand-bg text-text-color font-sans overflow-hidden antialiased-none"
		data-sveltekit-preload-data="hover"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
